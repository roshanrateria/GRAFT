<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:;">
  <title>Expense Tracker</title>
  <style>
    :root {
      --color-background: #0e0b0b;
      --color-surface: #17120f;
      --color-bone: #e9e1d0;
      --color-brass: #b08d57;
      --color-vein-green: #6f9a7d;
      --color-alert: #c4472f;
      --font-heading: 'Cormorant Garamond', Georgia, serif;
      --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-ledger: 'IBM Plex Mono', monospace;
      --text-xs: 0.64rem;
      --text-base: 1rem;
      --text-lg: 1.25rem;
      --space-2: 0.5rem;
      --space-4: 1rem;
      --radius-md: 4px;
      --radius-lg: 8px;
    }
    @media (prefers-color-scheme: light) {
      :root { --color-background: #f5f1eb; --color-surface: #ffffff; --color-bone: #1a1614; --color-brass: #8b6914; --color-vein-green: #2d5a3d; }
    }
    [data-theme="light"] { --color-background: #f5f1eb; --color-surface: #ffffff; --color-bone: #1a1614; }
    @media (prefers-reduced-motion: reduce) { * { animation-duration: 0.01ms !important; } }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-body); color: var(--color-bone); background-color: var(--color-background); min-height: 100%; padding: var(--space-4); }
    .expense-tracker { display: flex; flex-direction: column; gap: var(--space-4); }
    .header { text-align: center; }
    .header h1 { font-family: var(--font-heading); font-size: var(--text-lg); }
    .category-list { display: flex; flex-wrap: wrap; gap: var(--space-2); padding: var(--space-4); background: var(--color-surface); border-radius: var(--radius-lg); border: 1px solid rgba(176, 141, 87, 0.3); }
    .category { padding: var(--space-2) var(--space-4); background: rgba(176, 141, 87, 0.1); border-radius: var(--radius-md); font-size: var(--text-xs); cursor: pointer; border: 1px solid transparent; }
    .category:hover { background: rgba(176, 141, 87, 0.2); }
    .category:focus { outline: 2px solid var(--color-brass); outline-offset: 2px; }
    .category.selected { border-color: var(--color-brass); background: rgba(176, 141, 87, 0.3); }
    .totals { display: flex; flex-direction: column; gap: var(--space-2); padding: var(--space-4); background: var(--color-surface); border-radius: var(--radius-lg); border: 1px solid rgba(176, 141, 87, 0.3); }
    .total-row { display: flex; justify-content: space-between; font-family: var(--font-ledger); font-size: var(--text-xs); }
    .total-row.grand-total { border-top: 1px solid rgba(176, 141, 87, 0.3); padding-top: var(--space-2); font-size: var(--text-base); color: var(--color-brass); }
    .empty-state { text-align: center; padding: var(--space-4); opacity: 0.7; font-style: italic; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }
  </style>
</head>
<body>
  <div class="expense-tracker" role="region" aria-label="Expense Tracker">
    <div class="header"><h1>Expenses by Category</h1></div>
    <div class="category-list" id="categories" role="tablist" aria-label="Filter by category"></div>
    <div class="totals" id="totals" aria-live="polite"></div>
  </div>
  <script>
    const API_VERSION = '1.0.0';
    let grantedPermissions = [];
    let currentTheme = 'dark';
    let expenses = [];
    let categories = ['Food', 'Transport', 'Entertainment', 'Utilities', 'Shopping', 'Health'];
    let selectedCategory = null;
    
    function sendMessage(msg) { window.parent.postMessage(msg, '*'); }
    function emit(port, payload) { sendMessage({ type: 'emit', port, payload }); }
    
    function renderCategories() {
      const container = document.getElementById('categories');
      container.innerHTML = categories.map(cat => 
        `<button class="category ${selectedCategory === cat ? 'selected' : ''}" role="tab" aria-selected="${selectedCategory === cat}" tabindex="0">${cat}</button>`
      ).join('');
      container.querySelectorAll('.category').forEach((btn, i) => {
        btn.addEventListener('click', () => {
          selectedCategory = selectedCategory === categories[i] ? null : categories[i];
          renderCategories();
          renderTotals();
        });
      });
    }
    
    function renderTotals() {
      const container = document.getElementById('totals');
      if (!expenses || expenses.length === 0) {
        container.innerHTML = '<div class="empty-state">No expenses recorded</div>';
        return;
      }
      const filtered = selectedCategory ? expenses.filter(e => e.category === selectedCategory) : expenses;
      const byCategory = {};
      filtered.forEach(e => { byCategory[e.category] = (byCategory[e.category] || 0) + e.amount; });
      const grandTotal = filtered.reduce((sum, e) => sum + e.amount, 0);
      let html = Object.entries(byCategory).map(([cat, amount]) => 
        `<div class="total-row"><span>${cat}</span><span>$${amount.toFixed(2)}</span></div>`
      ).join('');
      html += `<div class="total-row grand-total"><span>Total</span><span>$${grandTotal.toFixed(2)}</span></div>`;
      container.innerHTML = html;
      emit('expenseTotal', { category: selectedCategory, total: grandTotal, count: filtered.length });
    }
    
    function handleMessage(event) {
      const msg = event.data;
      if (!msg || typeof msg !== 'object') return;
      switch (msg.type) {
        case 'init':
          grantedPermissions = msg.granted || [];
          currentTheme = msg.theme || 'dark';
          document.documentElement.setAttribute('data-theme', currentTheme);
          break;
        case 'data':
          if (msg.value && msg.value.expenses) {
            expenses = msg.value.expenses;
            renderCategories();
            renderTotals();
          }
          break;
      }
    }
    
    sendMessage({ type: 'hello', apiVersion: API_VERSION });
    window.addEventListener('message', handleMessage);
    renderCategories();
    renderTotals();
  </script>
</body>
</html>
