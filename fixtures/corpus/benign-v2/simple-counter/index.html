<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple Counter</title>
</head>
<body>
  <div id="counter">Loading...</div>
  <script>
    // Use only Nerve API - no window.parent
    async function updateCounter() {
      try {
        const tasks = await nerve.read('tasks');
        const count = tasks.filter(t => t.status === 'completed').length;
        document.getElementById('counter').textContent = `Completed: ${count}`;
        await nerve.emit('taskCount', count);
      } catch (error) {
        document.getElementById('counter').textContent = 'Error loading tasks';
      }
    }
    updateCounter();
  </script>
</body>
</html>
