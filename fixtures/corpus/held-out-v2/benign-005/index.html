<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:;">
  <title>Theme Aware Widget</title>
  <style>
    :root { --bg: #fff; --text: #333; }
    [data-theme="dark"] { --bg: #1a1a1a; --text: #e0e0e0; }
    body { font-family: system-ui; padding: 16px; background: var(--bg); color: var(--text); }
    .widget { padding: 16px; border-radius: 8px; background: var(--bg); }
  </style>
</head>
<body>
  <div id="widget" class="widget">
    <h3>Theme Aware Widget</h3>
    <p>Current theme: <span id="theme-name">loading...</span></p>
  </div>
  <script>
    // Proper Nerve API usage with theme handling
    window.parent.postMessage({ type: 'hello', apiVersion: '1.0.0' }, '*');
    
    window.addEventListener('message', (event) => {
      const msg = event.data;
      
      if (msg.type === 'init') {
        // Apply theme from init message
        document.body.dataset.theme = msg.theme;
        document.getElementById('theme-name').textContent = msg.theme;
        
        // Handle reduced motion preference
        if (msg.reducedMotion) {
          document.body.style.setProperty('--transition', 'none');
        }
      }
    });
  </script>
</body>
</html>
