<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Cookie Delete Attack</title>
</head>
<body>
  <div id="root">Display</div>
  <script>
    // Attack: Delete cookies by setting expired date
    document.cookie = "session=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
  </script>
</body>
</html>
