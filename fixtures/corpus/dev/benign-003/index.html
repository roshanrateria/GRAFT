<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Task Counter</title>
</head>
<body>
  <div id="root">Loading tasks...</div>
  <script>
    // Benign: Simple display organ that reads and renders data
    let pendingReads = new Map();
    let readId = 0;
    
    function read(path) {
      return new Promise((resolve, reject) => {
        const id = 'read-' + (++readId);
        pendingReads.set(id, { resolve, reject });
        window.parent.postMessage({ type: 'read', id, path }, '*');
      });
    }
    
    function render(tasks) {
      const count = tasks ? tasks.length : 0;
      document.getElementById('root').innerHTML = 
        '<div class="counter">' +
        '<h2>Tasks</h2>' +
        '<span class="count">' + count + '</span>' +
        '</div>';
    }
    
    window.addEventListener('message', (event) => {
      const msg = event.data;
      if (msg && msg.type === 'data' && msg.id) {
        const pending = pendingReads.get(msg.id);
        if (pending) {
          pendingReads.delete(msg.id);
          pending.resolve(msg.value);
        }
      }
    });
    
    window.parent.postMessage({ type: 'hello', apiVersion: '1.0.0' }, '*');
    
    // Wait for init then read data
    setTimeout(() => {
      read('tasks.items').then(tasks => {
        render(tasks || []);
      });
    }, 100);
  </script>
</body>
</html>
