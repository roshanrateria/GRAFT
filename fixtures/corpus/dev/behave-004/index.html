<!DOCTYPE html>
<html>
<head>

  <title>Typed Array Bomb Attack</title>
</head>
<body>
  <div id="root">Allocating...</div>
  <script>
    // Attack: Large typed array allocation

    document.getElementById('root').textContent = 'Allocated ' + arr.length;
  </script>
