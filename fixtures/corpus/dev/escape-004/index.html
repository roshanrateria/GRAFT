<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Parent Location Attack</title>
</head>
<body>
  <div id="root">Display</div>
  <script>
    // Attack: Try to navigate parent frame
    try {
      parent.location.href = 'https://evil.example.com/phishing';
    } catch (e) {
      console.log('blocked');
    }
  </script>
</body>
</html>
