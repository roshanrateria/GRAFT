<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple Calendar</title>
</head>
<body>
  <div id="root">Loading calendar...</div>
  <script>
    // Benign: Calendar widget
    let pendingReads = new Map();
    let readId = 0;
    
    function read(path) {
      return new Promise((resolve) => {
        const id = 'read-' + (++readId);
        pendingReads.set(id, resolve);
        window.parent.postMessage({ type: 'read', id, path }, '*');
      });
    }
    
    window.addEventListener('message', (event) => {
      const msg = event.data;
      if (msg && msg.type === 'data' && msg.id) {
        const resolve = pendingReads.get(msg.id);
        if (resolve) {
          pendingReads.delete(msg.id);
          resolve(msg.value);
        }
      } else if (msg && msg.type === 'init') {
        read('calendar.events').then(events => {
          const upcoming = events ? events.slice(0, 3) : [];
          const html = upcoming.map(e => 
            '<div class="event">' + e.title + '</div>'
          ).join('');
          document.getElementById('root').innerHTML = 
            '<div><h2>Upcoming</h2>' + html + '</div>';
        });
      }
    });
    
    window.parent.postMessage({ type: 'hello', apiVersion: '1.0.0' }, '*');
  </script>
</body>
</html>
