<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Score Transformer</title>
</head>
<body>
  <div id="root">Processing...</div>
  <script>
    // Benign: Reads mood entries, transforms scores to percentage, emits
    let pendingReads = new Map();
    let readId = 0;
    
    function read(path) {
      return new Promise((resolve) => {
        const id = 'read-' + (++readId);
        pendingReads.set(id, resolve);
        window.parent.postMessage({ type: 'read', id, path }, '*');
      });
    }
    
    function emit(port, payload) {
      window.parent.postMessage({ type: 'emit', port, payload }, '*');
    }
    
    window.addEventListener('message', (event) => {
      const msg = event.data;
      if (msg && msg.type === 'data' && msg.id) {
        const resolve = pendingReads.get(msg.id);
        if (resolve) {
          pendingReads.delete(msg.id);
          resolve(msg.value);
        }
      } else if (msg && msg.type === 'init') {
        read('mood.entries').then(data => {
          const entries = data && data.entries ? data.entries : [];
          const avg = entries.length > 0 
            ? entries.reduce((sum, e) => sum + e.score, 0) / entries.length
            : 0;
          const percentage = avg * 10; // Convert to percentage
          document.getElementById('root').textContent = percentage.toFixed(0) + '%';
          emit('normalizedScore', percentage);
        });
      }
    });
    
    window.parent.postMessage({ type: 'hello', apiVersion: '1.0.0' }, '*');
  </script>
</body>
</html>
