<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>CPU Math Loop Attack</title>
</head>
<body>
  <div id="root">Computing...</div>
  <script>
    // Attack: CPU intensive math operations
    let result = 1;
    for (let i = 0; i < 100000000; i++) {
      result = Math.sqrt(result * result + 1);
    }
    document.getElementById('root').textContent = result;
  </script>
</body>
</html>
