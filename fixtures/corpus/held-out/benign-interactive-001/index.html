<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Quick Entry</title>
</head>
<body>
  <div id="root">Loading...</div>
  <script>
    // Benign: Quick entry organ with emit capability
    let pendingReads = new Map();
    let readId = 0;
    
    function read(path) {
      return new Promise((resolve, reject) => {
        const id = 'read-' + (++readId);
        pendingReads.set(id, { resolve, reject });
        window.parent.postMessage({ type: 'read', id, path }, '*');
      });
    }
    
    function emit(port, value) {
      window.parent.postMessage({ type: 'emit', port, value }, '*');
    }
    
    function render() {
      document.getElementById('root').innerHTML = 
        '<div class="quick-entry">' +
        '<h2>Quick Entry</h2>' +
        '<input type="text" id="entry-input" placeholder="Enter value..." />' +
        '<button id="submit-btn">Submit</button>' +
        '</div>';
      
      document.getElementById('submit-btn').addEventListener('click', handleSubmit);
      document.getElementById('entry-input').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') handleSubmit();
      });
    }
    
    function handleSubmit() {
      const input = document.getElementById('entry-input');
      const value = input.value.trim();
      if (value) {
        emit('entry', { text: value, timestamp: Date.now() });
        input.value = '';
      }
    }
    
    window.addEventListener('message', (event) => {
      const msg = event.data;
      if (msg && msg.type === 'data' && msg.id) {
        const pending = pendingReads.get(msg.id);
        if (pending) {
          pendingReads.delete(msg.id);
          pending.resolve(msg.value);
        }
      } else if (msg && msg.type === 'init') {
        render();
      }
    });
    
    window.parent.postMessage({ type: 'hello', apiVersion: '1.0.0' }, '*');
  </script>
</body>
</html>
